// Forsprang, a native WebView app over Min side (replaced the Trusted Web
// Activity on 13 November 2026 so the window is ours and can refuse screenshots).
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.9.1'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}
